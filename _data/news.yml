- date: Aug 2026
  text: >
    Both of my interns, <a target="_blank" href="https://yuzhe.vercel.app/">Yuzhe You</a> and
    <a target="_blank" href="https://www.steffenholter.com/">Steffen Holter</a>, had their work
    accepted to ACM UIST 2026! Yuzhe's <a target="_blank"
    href="assets/papers/you-uist2026.pdf">Surprise2Refine</a> explores agent-assisted creative
    scaffolding, while Steffen's <a target="_blank"
    href="assets/papers/holter-uist2026.pdf">UXCascade</a> tackles usability testing with
    simulated user agents. Congratulations to both!

- date: Feb 2026
  text: >
    My intern <a target="_blank" href="https://serendipitysx.github.io/">Shishi Xiao</a>'s
    work on stylized chart generation has been accepted to CVPR! Stay tuned for more details.

- date: Jun 2025
  text: >
    A very interesting work (IMO) on time series visual summarization has been accepted to
    IEEE VIS. And my intern <a target="_blank" href="https://donghoon.io/">Donghoon Shin</a>'s
    work on AI agents for real time design collaboration has been conditionally accepted to
    UIST. Stay tuned for more details.

- date: Jan 2025
  text: >
    Adobe Research has released <a target="_blank"
    href="https://research.adobe.com/news/adobe-research-interns-work-featured-on-the-summit-stage/">an
    article</a> to explain what happened behind the scene throughout my mentee's internship
    experience that lead to the award winning ACM CHI Conference paper and Adobe Summit Sneaks.

- date: Apr 2024
  text: >
    My intern <a target="_blank" href="https://tongyuzhou.com/#/">Tongyu Zhou</a>'s work on
    message based infographics authoring was selected to be presented as <a target="_blank"
    href="https://www.youtube.com/watch?v=XSMO9-7pcq8">#ProjectInfographIt</a> at Adobe SUMMIT
    Sneaks 2024! It has also been accepted (with Best Paper Honorable Mention!) at CHI 2024.

- date: Mar 2022
  text: >
    I appeared in Adobe Summit to showcase one of my ongoing research projects. Check it out
    <a target="_blank" href="https://business.adobe.com/summit/2022/sessions/project-style-blast-mb9-6.html">here</a>.

- date: Oct 2021
  text: >
    I will serve as a Program Committee in the Web Conference 2022.
