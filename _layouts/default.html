<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}Gromit Yeuk-Yin Chan</title>
  <meta name="description" content="Gromit Yeuk-Yin Chan, Senior Research Scientist at Adobe Research. Visualization, data management, and human-computer interaction.">
  <link rel="stylesheet" href="{{ "/assets/css/acl.css" | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="icon" type="image/x-icon" href="{{ "/favicon.ico" | relative_url }}">
  <link rel="icon" type="image/png" href="{{ "/favicon.png" | relative_url }}">
</head>

<body>
  <header class="site-header">
    <div class="wrap">
      <div class="identity">
        <h1 class="site-name"><a href="{{ "/" | relative_url }}">Gromit Yeuk-Yin Chan</a></h1>
        <p class="affiliation">
          Senior Research Scientist, <a href="https://research.adobe.com/">Adobe Research</a><br>
          Ph.D, New York University
        </p>
      </div>

      <div class="logos" aria-hidden="true">
        <img class="logo-adobe" src="{{ "/assets/images/adobe.png" | relative_url }}" alt="">
        <div class="logo-stack">
          <img src="{{ "/assets/images/nyu.jpg" | relative_url }}" alt="">
          <img src="{{ "/assets/images/hkust.png" | relative_url }}" alt="">
        </div>
      </div>

      <nav class="site-nav" aria-label="Main">
        <a href="{{ "/index.html" | relative_url }}" class="{% if page.title == "Home" %}on{% endif %}">Home</a>
        <a href="{{ "/assets/cv/CV-Gromit.pdf" | relative_url }}">CV</a>
        <a href="{{ "/research.html" | relative_url }}" class="{% if page.title == "Research" %}on{% endif %}">Research</a>
        <a href="{{ "/blog.html" | relative_url }}" class="{% if page.title == "Blog" or page.layout == "post" %}on{% endif %}">Blog</a>
        <a href="{{ "/personal.html" | relative_url }}" class="{% if page.title == "Personal" %}on{% endif %}">Personal</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="wrap">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      A08-429, 345 Park Avenue, San Jose, CA 95110<br>
      Design inspired by <a href="https://personal.lse.ac.uk/lembcke/personal.html">this LSE Economics Department personal page</a>.
    </div>
  </footer>

  <script>
    // Simple slideshow (used on the Personal page).
    var slideIndex = 1;
    function plusSlides(n) { showSlides(slideIndex += n); }
    function currentSlide(n) { showSlides(slideIndex = n); }
    function showSlides(n) {
      var slides = document.getElementsByClassName("mySlides");
      var dots = document.getElementsByClassName("dot");
      if (slides.length === 0) return;
      if (n > slides.length) { slideIndex = 1; }
      if (n < 1) { slideIndex = slides.length; }
      for (var i = 0; i < slides.length; i++) { slides[i].style.display = "none"; }
      for (var j = 0; j < dots.length; j++) { dots[j].className = dots[j].className.replace(" active", ""); }
      slides[slideIndex - 1].style.display = "block";
      if (dots.length >= slideIndex) { dots[slideIndex - 1].className += " active"; }
    }
    if (document.getElementsByClassName("mySlides").length > 0) { showSlides(slideIndex); }
  </script>
</body>
</html>
